<style>

/* Uniform Task Cards & Button Styling */

.in{animation:in .45s both}.noan .in{animation:none}@keyframes in{from{opacity:0;transform:translateY(14px)}}

.row{display:flex;gap:10px;align-items:center}

.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
.seg{display:flex;gap:6px;margin:12px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px}.seg button{flex:1;padding:11px;border-radius:12px;border:0;background:none;color:var(--mut);font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:.25s}.seg button.on{background:var(--acc);color:#fff;box-shadow:0 4px 14px rgba(26,92,255,.4)}

@keyframes fd{from{opacity:0}}.sheet{width:100%;max-width:480px;max-height:86%;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}

.hi{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}.hi:last-child{border:0}.hi small{color:var(--mut)}
.pos{color:var(--grn);font-weight:700;font-size:16px}

.ban{border-radius:22px;padding:24px 20px;text-align:center;font-size:20px;font-weight:600;line-height:1.35;background:linear-gradient(120deg,#0b5fd8,#0098ea 60%,#22d3ee);position:relative;overflow:hidden;margin-bottom:12px}.ban em{display:block;font-style:normal;color:#e8fbff;font-size:16px;margin-top:6px;font-weight:500}.ban::after{content:"";position:absolute;right:-40px;top:-30px;width:140px;height:140px;border-radius:50%;background:conic-gradient(#ffffff55,#ffffff00,#ffffff55);animation:rt 8s linear infinite}@keyframes rt{to{transform:rotate(360deg)}}.ban span{position:relative;z-index:1}
.mini{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 4px;font:inherit;font-size:12px;color:var(--mut);cursor:pointer;width:68px;display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;transition:transform .12s}.mini:active{transform:scale(.93)}
.pod{display:flex;align-items:flex-end;gap:10px;margin:16px 0}.pod>div{flex:1;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:center;padding:14px 6px;animation:rise .6s both;min-width:0}.pod .p1{border-color:#8a6a1a;background:linear-gradient(#2a2410,var(--card));padding-bottom:34px}.pod .p3{border-color:#6a3a1a}@keyframes rise{from{transform:translateY(40px);opacity:0}}
.rk{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;font-weight:700;color:#222;margin-bottom:6px}

.lrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}.lrow:last-child{border:0}.you{border:1px solid #1a3a8f;background:#0d1a40;border-radius:18px;padding:12px 14px;margin-top:4px;color:#fff}.you b{color:#4a8aff}
.menu{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 64px);width:280px;background:var(--card);border:1px solid var(--line);border-radius:18px;z-index:20;display:none;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.5)}.menu.on{display:block;animation:pop .25s}
.menu div{display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:16px;cursor:pointer}.menu div:active{background:var(--card2)}.menu span{margin-left:auto;color:var(--mut);font-size:14px}
.tg{width:46px;height:26px;border-radius:14px;background:#555;position:relative;margin-left:auto;transition:.25s}.tg::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}.tg.on{background:var(--acc)}.tg.on::after{left:23px}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,30px);background:#222;color:#fff;padding:12px 20px;border-radius:999px;opacity:0;transition:.3s;z-index:50;font-size:15px;pointer-events:none;max-width:90%;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
input.in2{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:16px;margin:8px 0;user-select:text}
.ring{width:120px;height:120px;margin:10px auto;position:relative}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px}
.cr{height:140px;border-radius:18px;background:linear-gradient(120deg,#0b5fd8,#22d3ee,#0098ea);background-size:200% 200%;animation:gr 5s ease infinite;margin:10px 0}@keyframes gr{50%{background-position:100% 50%}}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.days div{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 2px;text-align:center;font-size:13px;color:var(--mut)}.days div.ok{background:#14341f;border-color:#1f7a3a;color:#7af0a0}.days div.cur{border-color:var(--gold);color:var(--gold);animation:pulse2 1.5s infinite}@keyframes pulse2{50%{box-shadow:0 0 0 4px rgba(255,178,26,.25)}}.days b{display:block;font-size:16px;color:inherit}

    el.style.backgroundSize='cover';

  };

function hideSplash(durationSec){
  const el=$('#splash');if(!el)return;
  const ms=Math.max(800,(Number(durationSec)||2.5)*1000);
  const begin=()=>setTimeout(()=>{
    el.classList.add('fade-out');
    setTimeout(()=>{if(el.parentNode)el.remove()},300);
  },ms);
  if(el.dataset.photoReady==='0' && CONF.splash && CONF.splash.img){
    let started=false;
    const startOnce=()=>{if(started)return;started=true;begin()};
    el.addEventListener('splashphoto',startOnce,{once:true});
    setTimeout(startOnce,5000);
    return;
  }
  begin();
}

function getReferrerId(){
  let raw='';
  try{
    if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)
      raw=String(tg.initDataUnsafe.start_param);
  }catch(e){}
  const readParams=txt=>{
    try{
      const q=new URLSearchParams(txt||'');
      return q.get('tgWebAppStartParam')||q.get('startapp')||q.get('start_param')||'';
    }catch(e){return '';}
  };
  if(!raw)raw=readParams(window.location.search);
  if(!raw&&window.location.hash)raw=readParams(window.location.hash.replace(/^#/, ''));
  if(!raw)return null;
  try{raw=decodeURIComponent(raw);}catch(e){}
  const match=String(raw).trim().match(/^ref_(\d+)$/);
  if(!match)return null;
  const refId=match[1];
  return refId!==String(U.id)?refId:null;
}

async function creditReferrer(refId,rewardAmount){
  if(!db||!refId||String(refId)===String(U.id))return false;
  // Keep referral writes scoped to the inviter's state node. A transaction on the
  // entire users/{id} profile can fail when Firebase rules permit state-only writes.
  try{
    const targetRef=db.ref('users/'+String(refId)+'/state');
    let didCredit=false;
    const friendName=(U.first_name+(U.last_name?' '+U.last_name:'')).trim()||'Friend';
    const friendId=String(U.id);
    const amount=Math.max(0,Number(rewardAmount)||0);
    const result=await targetRef.transaction(current=>{
      didCredit=false;
      if(!current||typeof current!=='object')return;
      const st={...current};
      const list=Array.isArray(st.invs)?[...st.invs]:[];
      if(list.some(x=>String(x&&(x.id||x.uid))===friendId))return;
      st.inv=Number(st.inv||st.invites||0)+1;
      st.invites=st.inv;
      st.earn=(Number(st.earn)||0)+amount;
      st.b=(Number(st.b||st.balance)||0)+amount;
      st.balance=st.b;
      st.life=(Number(st.life||st.totalEarned)||0)+amount;
      st.totalEarned=st.life;
      list.unshift({id:friendId,n:friendName,username:(U.username||'').replace(/^@/,''),photo_url:U.photo_url||'',ts:Date.now()});
      st.invs=list.slice(0,200);
      const history=Array.isArray(st.hist)?[...st.hist]:[];
      history.unshift({a:'+'+f(amount)+' TON',s:'Friend Joined: '+friendName,k:'t',ts:Date.now()});
      st.hist=history.slice(0,60);
      didCredit=true;
      return st;
    },undefined,false);
    if(!result.committed||!didCredit){
      console.info('[Referral] No credit: inviter state missing, duplicate invite, or transaction not committed:',refId);
      return false;
    }
    console.info('[Referral] Credited inviter state:',refId,'amount:',amount);
    return true;
  }catch(err){
    console.warn('[Referral] Failed to credit inviter state. Check Firebase Database Rules for users/{uid}/state:',err);
    return false;
  }
}

async function checkAndApplyReferral(){
  const refId=getReferrerId();
  if(!refId || String(refId)===String(U.id) || S.refBy)return;
  // Save the referral marker only after attempting the one-time credit.
  // The inviter's Firebase user record must already exist and rules must allow this write.
  const credited=await creditReferrer(refId,CFG.inv);
  if(credited){
    S.refBy=String(refId);
    await save();
  }else{
    console.warn('[Referral] No reward credited. Confirm inviter has opened the app and Firebase rules allow the transaction.');
  }
}

async wdok(){
  const bal=Number(S.b)||0;
  if(bal<CFG.minW){
    toast('Minimum withdrawal is '+f(CFG.minW)+' TON');
    return;
  }
  if(!S.wallet){toast('Set wallet address first');return;}
  if(!db||!userRef||!userStateRef||U.id===null||U.id===undefined){
    toast('Firebase is not connected. Please try again.');
    console.error('Withdrawal blocked: Firebase/user references unavailable.');
    return;
  }

  const wid='wd_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  const now=Date.now();
  const wallet=S.wallet;
  const uid=String(U.id);
  const previous={
    b:S.b,
    wds:Array.isArray(S.wds)?S.wds.slice():[],
    hist:Array.isArray(S.hist)?S.hist.slice():[]
  };
  const newWd={id:wid,a:bal,amount:bal,wallet:wallet,status:'pending',ts:now};

  S.b=0;
  S.wds=Array.isArray(S.wds)?S.wds.slice():[];
  S.wds.unshift(newWd);
  hist('-'+f(bal)+' TON','Withdrawal request','w');

  try{
    await saveQueue;
    const snapshot=JSON.parse(JSON.stringify(S));
    const record={
      id:wid,
      uid:uid,
      username:(U.username||'').replace(/^@/,''),
      amount:bal,
      a:bal,
      wallet:wallet,
      status:'pending',
      ts:now
    };
    const updates={};
    updates['users/'+uid+'/state']=snapshot;
    updates['withdrawals/'+wid]=record;
    updates['users/'+uid+'/id']=uid;
    updates['users/'+uid+'/name']=(U.first_name+(U.last_name?' '+U.last_name:'')).trim()||'Player';
    updates['users/'+uid+'/username']=(U.username||'').replace(/^@/,'');
    updates['users/'+uid+'/photo_url']=U.photo_url||'';
    updates['users/'+uid+'/lastActive']=now;

    // Save user state and admin withdrawal record atomically.
    await db.ref().update(updates);

    closeM();
    confetti();
    toast('🎉 Withdrawal request submitted!');
    render(true);
    countUp();
  }catch(e){
    S.b=previous.b;
    S.wds=previous.wds;
    S.hist=previous.hist;
    console.error('Withdrawal submission failed:',e);
    toast('Withdrawal failed. Your balance has been restored.');
    render(true);
    countUp();
  }
},

cx.save();cx.beginPath();cx.roundRect(-17,-34,34,28,14);cx.clip();cx.fillStyle='#2b2b36';for(let i=0;i<4;i++){cx.beginPath();cx.moveTo(-14+i*8,-34);cx.quadraticCurveTo(-9+i*8,-20,-14+i*8+3,-6);cx.lineTo(-14+i*8+6,-6);cx.quadraticCurveTo(-4+i*8,-20,-8+i*8+4,-34);cx.fill()}cx.restore();

const SFX={bad:false,pool:[],i:0},BG={a:null,bad:false};
function initAud(){SFX.pool=[];SFX.bad=false;BG.bad=false;try{for(let i=0;i<3;i++){const a=new Audio(CFG.jump);a.preload='auto';a.volume=CFG.sfxVol;SFX.pool.push(a)}if(BG.a)BG.a.pause();BG.a=new Audio(CFG.bgm);BG.a.loop=true;BG.a.volume=CFG.bgmVol;BG.a.preload='auto';BG.a.addEventListener('error',()=>{BG.bad=true})}catch(e){SFX.bad=BG.bad=true}}
function jumpSnd(){if(!S.snd)return;const fb=()=>{SFX.bad=true;gs(420,.12,'sine',.1,640)};if(SFX.bad)return gs(420,.12,'sine',.1,640);try{const a=SFX.pool[SFX.i++%3];a.currentTime=0;const pr=a.play();if(pr&&pr.catch)pr.catch(fb)}catch(e){fb()}}
function bgm(o){const a=BG.a;if(!a||BG.bad)return;try{if(o&&S.snd){a.currentTime=0;const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{BG.bad=true})}else a.pause()}catch(e){}}

const CH={ok:false};
const lsc=u=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s)});
async function loadChar(){try{if(!window.THREE)await lsc('https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js');if(!THREE.GLTFLoader)await lsc('https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js');
const gltf=await new Promise((res,rej)=>new THREE.GLTFLoader().load(CFG.model,res,undefined,rej));

sc.add(new THREE.AmbientLight(0xffffff,.9));const dl=new THREE.DirectionalLight(0xffffff,1.1);dl.position.set(2,4,6);sc.add(dl);
const obj=gltf.scene,box=new THREE.Box3().setFromObject(obj),size=box.getSize(new THREE.Vector3()),ctr=box.getCenter(new THREE.Vector3()),k=1.9/Math.max(size.x,size.y,size.z),pv=new THREE.Group();
obj.scale.setScalar(k);obj.position.set(-ctr.x*k,-box.min.y*k-1,-ctr.z*k);pv.add(obj);sc.add(pv);
let mix=null;if(gltf.animations&&gltf.animations.length){mix=new THREE.AnimationMixer(obj);mix.clipAction(gltf.animations[0]).play()}

cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.scale((2-stre)*(1+p.sq*.1),stre*sq);
if(p.prop>0){cx.save();cx.translate(0,-s-2);rr(-2,0,4,10,1,'#444');cx.rotate(T*.6);cx.fillStyle='#ff8a1f';cx.fillRect(-18,-2,36,4);cx.restore()}
cx.drawImage(r.domElement,-s/2,-s,s,s);cx.restore()};
CH.ok=true}catch(e){console.warn('Character model not loaded, using the default zebra:',e)}}
function loop(n){if(!on)return;raf=requestAnimationFrame(loop);acc+=Math.min(100,n-last);last=n;while(acc>=16.667){acc-=16.667;if(St==='play')step();else{T++;g.fx.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.l--});g.fx=g.fx.filter(q=>q.l>0);if(shake>0)shake*=.85}}draw()}
function open(){ov.style.display='block';rs();done=false;earned=0;T=0;shake=0;ctl.on=false;init();St='play';on=true;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}try{tg&&tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}bgm(1);last=performance.now();acc=0;raf=requestAnimationFrame(loop)}
